name: Investigate EXP Meeting Times

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run investigation
        env:
          VC_SCHOOL_ROUTE: ${{ secrets.VC_SCHOOL_ROUTE }}
          VC_CLIENT_ID: ${{ secrets.VC_CLIENT_ID }}
          VC_CLIENT_SECRET: ${{ secrets.VC_CLIENT_SECRET }}
        run: python investigate_exp_meeting_times.py
